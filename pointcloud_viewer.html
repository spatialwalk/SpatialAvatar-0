<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Point Cloud Viewer</title>
<style>
  :root {
    --bg: #0e0f13;
    --panel: rgba(20, 22, 28, 0.78);
    --text: #e7e9ee;
    --muted: #9aa0ab;
    --accent: #6ea8fe;
    --border: rgba(255, 255, 255, 0.08);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); }
  /* The viewer fills its container. When embedding, set a fixed height e.g. 480px. */
  #viewer {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
  }
  #viewer canvas { display: block; }
  #viewer.dragging::after {
    content: "Drop .glb to load";
    position: absolute; inset: 10px;
    border: 2px dashed var(--accent); border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    color: var(--accent); font-size: 16px; pointer-events: none;
    background: rgba(110,168,254,0.06);
  }

  #ui {
    position: absolute;
    left: 14px; bottom: 14px;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 10px 14px;
    background: var(--panel);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    border-radius: 12px;
    font-size: 13px;
    user-select: none;
    max-width: calc(100% - 28px);
  }
  #ui button {
    background: rgba(255,255,255,0.06);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 12px;
    cursor: pointer;
    font-size: 13px;
    transition: background .15s;
  }
  #ui button:hover { background: rgba(255,255,255,0.12); }
  #ui label { color: var(--muted); display: flex; align-items: center; gap: 8px; }
  #ui input[type=range] { accent-color: var(--accent); width: 110px; }

  #status {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 14px; text-align: center; padding: 20px;
    pointer-events: none;
  }
  html[data-embed="1"] #ui {
    display: none;
  }
  html[data-embed="1"] #status {
    font-size: 12px;
  }
</style>
</head>
<body>
  <div id="viewer">
    <div id="status">Loading…</div>
    <div id="ui">
      <button id="chooseBtn">Choose .glb</button>
      <button id="playBtn">⏸ Pause</button>
      <button id="resetBtn">Reset view</button>
      <label>Point size
        <input id="sizeSlider" type="range" min="1" max="20" value="4" />
      </label>
      <label><input id="rotateChk" type="checkbox" /> Auto-rotate</label>
    </div>
    <input id="fileInput" type="file" accept=".glb,model/gltf-binary" style="display:none" />
  </div>

  <!-- ====== CONFIG: pass ?model=path/to/model.glb when embedding ====== -->
  <script>
    const params = new URLSearchParams(window.location.search);
    window.MODEL_URL = params.get("model") || "J04NeIyBqBA_0_0__drv_FbWPEz8NFS8_11.glb";
    if (params.get("embed") === "1") {
      document.documentElement.dataset.embed = "1";
    }
  </script>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

    const container = document.getElementById("viewer");
    const statusEl  = document.getElementById("status");
    const ui        = document.getElementById("ui");
    const fileInput = document.getElementById("fileInput");

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0e0f13);
    const camera = new THREE.PerspectiveCamera(50, 1, 0.001, 100);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;

    const loader = new GLTFLoader();
    const clock = new THREE.Clock();
    let mixer = null, action = null;
    let pointMaterials = [];
    let currentRoot = null;
    let homeCam = null, homeTarget = null;
    let recenterFrame = 0;

    function resize() {
      const w = container.clientWidth, h = container.clientHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    window.addEventListener("resize", resize);

    function clearModel() {
      if (mixer) { mixer.stopAllAction(); mixer = null; }
      action = null; pointMaterials = [];
      recenterFrame = 0;
      if (currentRoot) {
        scene.remove(currentRoot);
        currentRoot.traverse((o) => {
          if (o.geometry) o.geometry.dispose();
          if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => m.dispose());
        });
        currentRoot = null;
      }
    }

    function onLoad(gltf) {
      currentRoot = gltf.scene;
      scene.add(currentRoot);

      // Tune point objects: vertex colors + visible size, keep original
      // material so morph-target animation still drives the points.
      currentRoot.traverse((obj) => {
        if (obj.isPoints) {
          const m = obj.material;
          const forceWhitePoints = /\/gpavatar\//i.test(window.MODEL_URL);
          m.vertexColors = !forceWhitePoints;
          if (forceWhitePoints) m.color.set(0xffffff);
          m.sizeAttenuation = true;
          const sizeScale = document.documentElement.dataset.embed === "1" ? 0.00065 : 0.001;
          m.size = document.getElementById("sizeSlider").value * sizeScale;
          m.needsUpdate = true;
          pointMaterials.push(m);
        }
      });

      framePointCloud();

      if (gltf.animations && gltf.animations.length) {
        mixer = new THREE.AnimationMixer(currentRoot);
        action = mixer.clipAction(gltf.animations[0]);
        action.play();
        document.getElementById("playBtn").textContent = "⏸ Pause";
      }

      statusEl.style.display = "none";
      resize();
    }

    function framePointCloud() {
      const stats = getPointCloudStats(currentRoot, true);
      if (!stats) {
        camera.position.set(0, 0, 3);
        controls.target.set(0, 0, 0);
        controls.update();
        homeCam = camera.position.clone();
        homeTarget = controls.target.clone();
        return;
      }

      currentRoot.position.sub(stats.center);
      currentRoot.updateMatrixWorld(true);

      const embedMode = document.documentElement.dataset.embed === "1";
      const extraShrink = embedMode && /\/(cvthead|gpavatar|portrait4d_v2)\//i.test(window.MODEL_URL);
      const embedScale = extraShrink ? 4.0 : 2.9;
      const dist = (stats.size / (2 * Math.tan((camera.fov * Math.PI) / 360))) * (embedMode ? embedScale : 2.1);

      camera.position.set(0, 0, dist);
      camera.near = Math.max(0.0001, dist / 1000);
      camera.far = Math.max(100, dist * 100);
      camera.updateProjectionMatrix();
      controls.target.set(0, embedMode ? stats.size * 0.06 : 0, 0);
      controls.update();
      homeCam = camera.position.clone();
      homeTarget = controls.target.clone();
    }

    function recenterPointCloud() {
      if (!currentRoot) return;
      const stats = getPointCloudStats(currentRoot, true);
      if (!stats) return;
      currentRoot.position.copy(stats.center).multiplyScalar(-1);
      currentRoot.updateMatrixWorld(true);
    }

    function getPointCloudStats(root, includeMorphTargets = false) {
      const xs = [], ys = [], zs = [];
      const point = new THREE.Vector3();

      root.updateMatrixWorld(true);
      root.traverse((obj) => {
        if (!obj.isPoints || !obj.geometry?.attributes?.position) return;

        const position = obj.geometry.attributes.position;
        const morphPositions = includeMorphTargets ? (obj.geometry.morphAttributes.position || []) : [];
        const morphInfluences = includeMorphTargets ? (obj.morphTargetInfluences || []) : [];
        const morphTargetsRelative = Boolean(obj.geometry.morphTargetsRelative);
        const stride = Math.max(1, Math.ceil(position.count / 12000));
        obj.updateMatrixWorld(true);

        for (let i = 0; i < position.count; i += stride) {
          const baseX = position.getX(i);
          const baseY = position.getY(i);
          const baseZ = position.getZ(i);
          let x = baseX, y = baseY, z = baseZ;

          for (let j = 0; j < morphPositions.length; j++) {
            const influence = morphInfluences[j] || 0;
            if (!influence) continue;

            const morph = morphPositions[j];
            if (morphTargetsRelative) {
              x += morph.getX(i) * influence;
              y += morph.getY(i) * influence;
              z += morph.getZ(i) * influence;
            } else {
              x += (morph.getX(i) - baseX) * influence;
              y += (morph.getY(i) - baseY) * influence;
              z += (morph.getZ(i) - baseZ) * influence;
            }
          }

          point.set(x, y, z).applyMatrix4(obj.matrixWorld).sub(root.position);
          xs.push(point.x);
          ys.push(point.y);
          zs.push(point.z);
        }
      });

      if (!xs.length) return null;

      xs.sort((a, b) => a - b);
      ys.sort((a, b) => a - b);
      zs.sort((a, b) => a - b);

      const q = (arr, p) => arr[Math.min(arr.length - 1, Math.max(0, Math.floor((arr.length - 1) * p)))];
      const x0 = q(xs, 0.08), x1 = q(xs, 0.92);
      const y0 = q(ys, 0.08), y1 = q(ys, 0.92);
      const z0 = q(zs, 0.08), z1 = q(zs, 0.92);
      const specialMethod = /\/(cvthead|gpavatar|portrait4d_v2)\//i.test(window.MODEL_URL);
      const yShift = document.documentElement.dataset.embed === "1"
        ? (y1 - y0) * (specialMethod ? 1.12 : 0.82)
        : 0;

      return {
        center: new THREE.Vector3(
          (x0 + x1) / 2 + (document.documentElement.dataset.embed === "1" ? (x1 - x0) : 0),
          (y0 + y1) / 2 - yShift,
          (z0 + z1) / 2
        ),
        size: Math.max(x1 - x0, y1 - y0, z1 - z0, 0.01)
      };
    }

    function onError(err) {
      console.error(err);
      showHint("Couldn't load: " + window.MODEL_URL);
    }

    function showHint(msg) {
      statusEl.style.display = "flex";
      statusEl.textContent = msg;
    }

    function loadBuffer(buf) {
      clearModel();
      // Self-contained .glb -> parse is fully offline, no fetch/Request involved.
      loader.parse(buf, "", onLoad, onError);
    }

    // ---- File picker + drag & drop (works even without a server / from file://) ----
    function readFile(file) {
      showHint("Loading " + file.name + " …");
      const r = new FileReader();
      r.onload = () => loadBuffer(r.result);
      r.onerror = () => onError(new Error("Could not read file"));
      r.readAsArrayBuffer(file);
    }
    document.getElementById("chooseBtn").addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", (e) => { if (e.target.files[0]) readFile(e.target.files[0]); });

    ["dragenter", "dragover"].forEach((ev) =>
      container.addEventListener(ev, (e) => { e.preventDefault(); container.classList.add("dragging"); }));
    ["dragleave", "drop"].forEach((ev) =>
      container.addEventListener(ev, (e) => { e.preventDefault(); container.classList.remove("dragging"); }));
    container.addEventListener("drop", (e) => {
      const files = [...(e.dataTransfer?.files || [])];
      const f = files.find((x) => x.name.toLowerCase().endsWith(".glb")) || files[0];
      if (f) readFile(f);
    });

    // ---- Try to auto-load by URL/path. XHR supports local file:// better than fetch. ----
    (function autoLoad() {
      const modelUrl = window.MODEL_URL;
      const xhr = new XMLHttpRequest();
      xhr.open("GET", modelUrl, true);
      xhr.responseType = "arraybuffer";
      xhr.onprogress = (e) => {
        if (e.lengthComputable) showHint(`Loading… ${Math.round((e.loaded / e.total) * 100)}%`);
      };
      xhr.onload = () => {
        if ((xhr.status >= 200 && xhr.status < 300) || (xhr.status === 0 && xhr.response)) {
          loadBuffer(xhr.response);
        } else {
          showHint(`Couldn't load (${xhr.status}): ${modelUrl}`);
        }
      };
      xhr.onerror = () => {
        const hint = window.location.protocol === "file:"
          ? "Local browser blocked auto-loading. Open through a static server or use Choose .glb."
          : "Couldn't load: " + modelUrl;
        showHint(hint);
      };
      try { xhr.send(); } catch (err) {
        console.error(err);
        showHint("Couldn't load: " + modelUrl);
      }
    })();

    // ---- Controls ----
    document.getElementById("playBtn").addEventListener("click", (e) => {
      if (!action) return;
      action.paused = !action.paused;
      e.target.textContent = action.paused ? "▶ Play" : "⏸ Pause";
    });
    document.getElementById("resetBtn").addEventListener("click", () => {
      if (homeCam) { camera.position.copy(homeCam); controls.target.copy(homeTarget); controls.update(); }
    });
    document.getElementById("sizeSlider").addEventListener("input", (e) => {
      const sizeScale = document.documentElement.dataset.embed === "1" ? 0.00065 : 0.001;
      const s = e.target.value * sizeScale;
      pointMaterials.forEach((m) => { m.size = s; });
    });
    document.getElementById("rotateChk").addEventListener("change", (e) => {
      controls.autoRotate = e.target.checked;
      controls.autoRotateSpeed = 1.5;
    });

    function animate() {
      requestAnimationFrame(animate);
      if (mixer) {
        mixer.update(clock.getDelta());
        recenterFrame = (recenterFrame + 1) % 4;
        if (recenterFrame === 0) recenterPointCloud();
      } else {
        clock.getDelta();
      }
      controls.update();
      renderer.render(scene, camera);
    }
    resize();
    animate();
  </script>
</body>
</html>
